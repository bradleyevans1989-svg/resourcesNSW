<title>Resources Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one rounded white "screen" on a warm ground; logo centred in the top bar with two tabs either side and a solid yellow corner button at each end. On phones the tabs drop to a bottom bar. */
:root{
  --ground:#EEEDE8; --screen:#FFFFFF; --ink:#24221E; --muted:#6B675F; --line:#E2E0DA; --soft:#F6F5F1;
  --accent:#F5B400; --accent-ink:#24221E; --accent-soft:#FFF4D1;
  --low:#3F8F5A; --med:#C98400; --high:#C7372F; --ok-bg:#E5F3E9; --warn-bg:#FFF1D6; --bad-bg:#FBE4E2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --plate:transparent;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0F0E0C; --screen:#1B1A17; --ink:#F1EFEA; --muted:#A39E94; --line:#2E2C28; --soft:#23221E;
  --accent:#F5B400; --accent-ink:#1B1A17; --accent-soft:#3A2F10;
  --low:#6CC28A; --med:#F0B23A; --high:#F07A6E; --ok-bg:#1D3325; --warn-bg:#3A2E12; --bad-bg:#3F1F1C;
  --plate:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F0E0C; --screen:#1B1A17; --ink:#F1EFEA; --muted:#A39E94; --line:#2E2C28; --soft:#23221E;
  --accent:#F5B400; --accent-ink:#1B1A17; --accent-soft:#3A2F10;
  --low:#6CC28A; --med:#F0B23A; --high:#F07A6E; --ok-bg:#1D3325; --warn-bg:#3A2E12; --bad-bg:#3F1F1C;
  --plate:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:16px 32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.screen{max-width:1180px;margin:0 auto;background:var(--screen);border-radius:28px;overflow:hidden;min-height:calc(100vh - 48px);display:flex;flex-direction:column}
/* top bar */
.bar{display:grid;grid-template-columns:64px 1fr auto 1fr 64px;align-items:stretch;min-height:64px;border-bottom:1px solid var(--line)}
.corner{background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;width:64px;min-height:64px}
.corner svg{width:22px;height:22px}
.corner:hover{filter:brightness(1.05)}
.tabs{display:flex;align-items:center;justify-content:space-evenly;gap:8px;padding-inline:8px}
.tab{background:none;border:0;font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:.02em;color:var(--muted);padding:6px 10px;border-radius:10px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent);border-radius:0}
.logo{display:grid;place-items:center;gap:2px;padding:8px 20px}
.hubname{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.32em;color:var(--ink);line-height:1;padding-left:.32em}
.logo img{height:34px;width:auto;display:block;background:var(--plate);border-radius:6px;padding:2px 6px}
.bottomtabs{display:none}
@media (max-width:820px){
  .bar{grid-template-columns:56px 1fr 56px}
  .bar .tabs{display:none}
  .corner{width:56px;min-height:56px}
  .logo img{height:26px}
  .screen{border-radius:20px;min-height:calc(100vh - 32px)}
  body{padding-block:12px 24px}
  .bottomtabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--screen);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomtabs .tab{font-size:16px;padding:12px 10px;white-space:nowrap}
  .bottomtabs{overflow-x:auto;scrollbar-width:none}
}
main{flex:1;padding:28px clamp(16px,4vw,40px) 40px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(30px,4vw,40px);text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:18px}
.eyebrow{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.head > div{display:grid;gap:4px;min-width:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--screen);padding:10px 16px;border-radius:12px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none;padding-inline:8px}
.btn svg{width:18px;height:18px}
/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--soft);border-radius:16px;padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--display);font-weight:600}
@media (max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--screen);border-color:var(--ink)}
/* list rows */
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;background:var(--screen);border:1px solid var(--line);border-radius:16px;padding:14px 18px 14px 0;overflow:hidden;width:100%}
.row:hover{border-color:var(--muted)}
.row .sev{align-self:stretch;border-radius:0 4px 4px 0;background:var(--line)}
.sev.Low{background:var(--low)}.sev.Medium{background:var(--med)}.sev.High{background:var(--high)}
.row .main{display:grid;gap:2px;min-width:0}
.row .title{font-weight:600;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.row .sub{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{display:grid;justify-items:end;gap:6px;font-size:13px;color:var(--muted)}
.rego{font-family:var(--mono);font-size:13px;background:var(--accent-soft);padding:1px 8px;border-radius:6px;color:var(--ink)}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);white-space:nowrap}
.pill.Open{background:var(--bad-bg);color:var(--high)}
.pill.Deferred{background:var(--warn-bg);color:var(--med)}
.pill.Completed{background:var(--ok-bg);color:var(--low)}
.pill.Allocated{background:var(--soft);color:var(--ink)}
.pill.Started{background:var(--warn-bg);color:var(--med)}
.jobs{display:grid;gap:10px;max-width:880px}
.job{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--screen);display:grid;gap:6px}
.job .jt{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.job .jt b{font-family:var(--display);font-size:18px;letter-spacing:.02em}
.job .jm{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px}
.job .warn{color:var(--high);font-size:13px;font-weight:600}
.job .actions{margin:0}
.free{display:flex;flex-wrap:wrap;gap:6px}
.free span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--screen)}
.daybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.daybar input[type=date]{width:auto;flex:1;min-width:150px;max-width:220px}
.daybar .btn.nav{border:1px solid var(--line);min-width:44px;justify-content:center;font-size:20px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line);padding:0 6px;border-radius:6px;font-weight:600}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
/* forms */
.formwrap{display:grid;gap:18px;max-width:880px}
fieldset{border:1px solid var(--line);border-radius:18px;padding:18px 20px 20px;margin:0;display:grid;gap:14px;min-width:0}
fieldset.mech{background:var(--soft)}
legend{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:18px;letter-spacing:.03em;padding:0 8px;margin-left:-8px;display:flex;gap:10px;align-items:center}
.who{font-size:11px;letter-spacing:.1em;background:var(--ink);color:var(--screen);padding:1px 8px;border-radius:999px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field > label,.field > .lbl{font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin-top:-4px}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=tel],input[type=email],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--screen);border-radius:10px;padding:10px 12px}
input[readonly]{background:var(--soft);font-weight:600}
textarea{min-height:96px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{background:transparent;border-style:dashed;color:var(--ink);opacity:1}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0}
.choice span{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-weight:500;background:var(--screen)}
.choice input:checked + span{background:var(--ink);color:var(--screen);border-color:var(--ink)}
.choice input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.choice input:disabled + span{cursor:default}
.sevpick .choice input:checked + span.Low{background:var(--low);border-color:var(--low);color:#fff}
.sevpick .choice input:checked + span.Medium{background:var(--med);border-color:var(--med);color:#fff}
.sevpick .choice input:checked + span.High{background:var(--high);border-color:var(--high);color:#fff}
.sevpick .choice span{padding:6px 12px;font-size:14px}
.circle{gap:2px;align-items:center}
.circle .choice span{border:2.5px solid transparent;border-radius:999px;background:none;padding:4px 12px;font-weight:600}
.circle .choice + .choice::before{content:"/";color:var(--muted);margin:0 2px}
.circle .choice{display:inline-flex;align-items:center}
.circle .choice input:checked + span{background:none;color:var(--ink);border-color:var(--ink)}
.circle .choice input:checked + span.Low{background:none;color:var(--low);border-color:var(--low)}
.circle .choice input:checked + span.Medium{background:none;color:var(--med);border-color:var(--med)}
.circle .choice input:checked + span.High{background:none;color:var(--high);border-color:var(--high)}
.circle .choice input:not(:checked):disabled + span{opacity:.45}
.tickc input:checked + span::before{content:"✓ "}
.tickc input:checked + span{background:var(--low)!important;border-color:var(--low)!important;color:#fff!important}
.rank{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding-top:12px}
.rank .opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.rank .drv{font-size:13px;color:var(--muted)}
.drop{position:relative;display:grid;place-items:center;gap:4px;border:2px dashed var(--line);border-radius:12px;padding:28px 16px;cursor:pointer;text-align:center;background:var(--screen)}
.drop.over,.drop:focus-within{border-color:var(--accent)}
.drop .link{color:var(--accent-ink,var(--ink));text-decoration:underline}
.filelist{display:grid;gap:8px;margin-top:10px}
.fileitem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px;color:inherit;text-decoration:none;min-width:0}
.fileitem img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.fileitem > span{flex:1;min-width:0;overflow-wrap:anywhere}
.ficon{width:56px;height:56px;display:grid;place-items:center;background:var(--soft);border-radius:6px;font-family:var(--mono);font-size:12px;flex:none!important}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:grid;grid-template-rows:auto 1fr;gap:12px;padding:16px;justify-items:end}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;justify-self:center}
@media print{.bar,.bottomtabs,.menu,.actions,.toast,[data-go]{display:none!important} body{background:#fff} fieldset{break-inside:avoid}}
.faults{display:grid;gap:12px}
.fault{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:12px}
.fault:first-child{border-top:0;padding-top:0}
.fault .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.fault .body{display:grid;gap:10px;min-width:0}
.fault .opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fault .opts input{max-width:200px}
.checklist{display:grid;gap:8px}
.check{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{background:var(--accent-soft);border-radius:14px;padding:12px 16px;font-size:14px}
.err{color:var(--high);font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--screen);padding:10px 18px;border-radius:12px;font-weight:600;z-index:10}
/* sign in */
.signin{flex:1;display:grid;place-items:center;padding:40px 16px}
.signcard{width:min(440px,100%);display:grid;gap:18px;text-align:center}
.signin.fieldbg{position:relative;background:transparent;isolation:isolate}
#bgfield{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0}
/* main page: the rock background fills the whole window, edge to edge */
body.homebg{padding:0;background:#111}
body.homebg .screen{max-width:none;border-radius:0;min-height:100vh;min-height:100dvh;background:transparent;overflow:visible}
.signin.fieldbg .signcard{position:relative;z-index:1}
.signin.fieldbg .linkbtn{color:#eee}
.signin.fieldbg .brandpanel{background:radial-gradient(120% 90% at 50% 0%,rgba(40,40,40,.62) 0%,rgba(17,17,17,.7) 70%)}
.signin.fieldbg .qbtn.shop{background:rgba(26,26,26,.85)}
.brandpanel{border-radius:20px;padding:28px 16px 22px;color:#fff;background:radial-gradient(120% 90% at 50% 0%,#2e2e2e 0%,#1a1a1a 55%,#111111 100%);display:grid;gap:14px;justify-items:center;overflow:hidden}
.brand{display:grid;justify-items:center;gap:6px}
.ringwrap{position:relative;width:120px;height:120px;margin-bottom:6px}
.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 2.4s linear infinite}
.ring circle{fill:none;stroke-width:3.5}
.ring .track{stroke:rgba(255,255,255,.14)}
.ring .arc{stroke:#F5B400;stroke-linecap:round;stroke-dasharray:32 68}
.disc{position:absolute;inset:12px;border-radius:50%;background:#111;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.4)}
.disc img{width:72%;height:auto;background:none!important;padding:0!important;margin:0!important}
.word{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:.01em;color:#fff}
.word span{color:#F5B400}
.tagline{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:rgba(255,255,255,.72);text-align:center}
.hubname{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.3em;font-size:13px;color:#111;background:#F5B400;border-radius:999px;padding:4px 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.brandpanel .ring{animation:none}
.brandpanel .ring .arc{stroke-dasharray:none;opacity:.9}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:18px;padding:16px;color:#fff;cursor:pointer;background:radial-gradient(90% 70% at 50% 35%,#2e2e2e 0%,#1a1a1a 55%,#0b0b0b 100%);transition:opacity .5s ease}
.splash.out{opacity:0;pointer-events:none}
.splash .ringwrap{width:168px;height:168px}
.splash .word{font-size:clamp(44px,12vw,72px)}
.splash .tagline{font-size:clamp(11px,2.6vw,15px)}
.splash .skip{font-size:12px;color:rgba(255,255,255,.5);margin-top:10px}
@media (prefers-reduced-motion:reduce){.ring{animation-duration:12s}}
.signcard form{display:grid;gap:12px;text-align:left}
.quick{display:grid;gap:10px}
.qbtn{display:grid;gap:2px;text-align:left;border:0;border-radius:14px;padding:16px 18px;background:#F5B400;color:#111;font:inherit;cursor:pointer}
.qbtn b{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.03em}
.qbtn small{font-size:13px;opacity:.8}
.qbtn.alt{background:var(--screen);color:var(--ink);border:1.5px solid var(--ink)}
.qbtn.alt b{font-size:18px}
.qbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.olist{display:grid}
.dlist{display:grid;gap:8px;max-width:760px}
.pin{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--ink)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--screen)}
.dedit{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.dedit input{flex:1;min-width:180px}
.prods{display:grid;gap:12px}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0;padding-bottom:0}
.pctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pctl select{width:auto}
.pprice{display:flex;align-items:center;gap:4px}
.pprice input{width:130px}
@media (max-width:640px){.prod{grid-template-columns:1fr}}
.oitem{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.qbtn.shop{background:#1a1a1a;color:#fff}
.qbtn.soon{background:transparent;color:var(--ink);border:1.5px dashed var(--line);opacity:.7;cursor:default}
.qbtn.soon b{font-size:18px}
.publinks{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center}
.linkbtn{background:none;border:0;padding:6px 2px;font:inherit;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.qbtn.shop small{opacity:.75}
.olines{display:grid;gap:10px}
.oline{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:10px;align-items:center}
.oline .qty{display:flex;align-items:center;gap:8px}
.oline .qty input{min-width:0}
.oline .qty span{font-size:13px;color:var(--muted);min-width:46px}
@media (max-width:640px){.oline{grid-template-columns:minmax(0,1fr) auto}.oline select{grid-column:1/-1}}
.pubbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--screen)}
.pubbar img{height:30px;width:auto;background:var(--plate);border-radius:6px;padding:2px 6px}
.pubmain{padding:24px 16px 48px;max-width:960px;margin:0 auto;width:100%}
.demo{display:grid;gap:8px;text-align:left}
.demo .accts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acct{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:0}
.acct:hover{border-color:var(--muted)}
.acct b{font-size:15px}.acct small{color:var(--muted)}
/* menu */
.menu{position:absolute;top:72px;left:16px;background:var(--screen);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:240px;z-index:5;box-shadow:0 12px 32px rgba(0,0,0,.12)}
.screen{position:relative}
.formcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fcard{border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:8px;align-content:start}
.fcard.add{border-style:dashed;color:var(--muted)}
.fleet{width:100%;min-width:640px;border-collapse:collapse;font-size:14px}
.fleet th{text-align:left;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.fleet td{padding:12px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.overdue{color:var(--high);font-weight:600}
@media (max-width:1100px){.tab{font-size:16px;padding:6px 6px}}
.bar.many{grid-template-columns:64px 1fr 64px}.bar.many .tabs{display:none}
.tabrow{display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px;padding:2px 12px;border-bottom:1px solid var(--line)}
.tabrow .tab{font-size:17px;padding:8px 8px}
@media (max-width:820px){.tabrow{display:none}}
.svcsec{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.svcsec h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;background:var(--soft);padding:10px 14px}
.svcrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.svcrow .svcnote{grid-column:1/-1;padding:6px 10px;font-size:14px}
.svcitem{min-width:0}.spec{font-size:13px;color:var(--muted);margin-top:2px}
.rowsgrid{width:100%;border-collapse:collapse;min-width:520px}.rowsgrid th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 6px;font-family:var(--display)}
.rowsgrid td{padding:3px}.rowsgrid input{padding:8px 10px}
.fcard.pick{text-align:left;background:var(--screen);cursor:pointer}.fcard.pick:hover{border-color:var(--muted)}
a.row{color:inherit;text-decoration:none}
@media (max-width:560px){.svcrow{grid-template-columns:1fr}}
a.btn{color:inherit;text-decoration:none}
.schedcard.over{border-left:5px solid var(--high)}.schedcard.soon{border-left:5px solid var(--med)}.schedcard.ok{border-left:5px solid var(--low)}
.f20{min-width:0}
.kmcard{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:var(--soft);border-radius:14px;padding:14px 16px;margin:14px 0;max-width:880px}
.kmcard>div{display:grid;gap:1px}.kmcard .lbl{font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kmcard b{font-size:22px;font-variant-numeric:tabular-nums}.kmcard small{font-size:13px;color:var(--muted)}.kmcard .kmlog{flex-basis:100%;font-size:14px}.kmcard .kmlog ul{margin:6px 0 0;padding-left:18px}.f20now{margin-bottom:10px}.f20nowh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px;font-size:14px}.f20nowh .linkbtn:first-of-type{margin-left:auto}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:4px}
.sc{background:var(--soft);border-radius:10px;padding:8px 10px;display:grid;gap:1px;min-width:0}
.sc span{font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sc b{font-variant-numeric:tabular-nums}.sc small{font-size:12px;color:var(--muted)}
.sc.over{background:var(--bad-bg)}.sc.over b,.sc.over small{color:var(--high)}.sc.soon{background:var(--warn-bg)}.sc.soon small{color:var(--med)}.sc.booked{background:var(--ok-bg)}
.schedform{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.f20 table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.f20 th{background:var(--soft);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:12px;padding:6px 8px;border:1px solid var(--line);text-align:center;line-height:1.15}
.f20 td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.f20 .f20h{margin-bottom:-1px}.f20 .f20t td:last-child{text-align:left}
@media print{.f20{break-inside:avoid}.daybar,.notice,.f20now{display:none!important}}
.vehdet{max-width:880px;margin-bottom:8px}.vehdet summary{cursor:pointer;font-weight:600;padding:12px 16px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.decltext{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:4px 16px;background:var(--soft);font-size:14px;line-height:1.55;min-width:0}
.decltext.open{max-height:none}
.decltext ul{padding-left:20px;margin:8px 0}.decltext li{margin:4px 0}
.agree{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;padding:10px 14px;border:1px solid var(--line);border-radius:12px;width:fit-content;background:var(--screen)}
.agree.plain{font-weight:500;border-color:transparent;padding-inline:0;background:none}
.agree input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.donecard{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--ok-bg);border-radius:20px;padding:20px 22px;max-width:880px}
.donecard h2{color:var(--low)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- Helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => { if(!d) return ""; const x = new Date(d+"T00:00:00"); return isNaN(x) ? esc(d) : x.toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}); };
const SEV_ORDER = {Low:1, Medium:2, High:3};
const topSev = r => (r.data.faults||[]).reduce((a,f)=> SEV_ORDER[f.sev]>(SEV_ORDER[a]||0) ? f.sev : a, "");
function status(r){
  if(FORMS[r.form].kind==="service") return "Completed";
  if(r.data.repairDate) return "Completed";
  const fl = (r.data.faults||[]).filter(x=>x.desc), rk = r.data.ranking||[];
  if(fl.length && fl.every((x,i)=>rk[i] && rk[i].done)) return "Completed";
  if(r.data.deferred) return "Deferred";
  return "Open";
}
function visible(kind){
  const u = state.user;
  return state.records.filter(r => FORMS[r.form] && FORMS[r.form].kind===kind && (
    u.role==="admin" || (u.role==="supplier" && r.data.supplier===u.company) || (u.role==="driver" && (kind==="service" || r.createdBy===u.id))
  )).sort((a,b)=> (b.data.date||"").localeCompare(a.data.date||""));
}

function tabs(){
  const t = state.user.role==="supplier" ? [["faults","Fault reports"],["services","Service sheets"],["hazard","Hazard report"],["fleet","Fleet"],["forms","Forms"],...(state.user.company==="Impact Diesel"?[["sched","Scheduling"],["audit","Compliance"]]:[])]
    : state.user.role==="driver" ? [["decl","Declaration"],["pre","Prestart"],["hazard","Hazard report"],["faults","Fault reports"]]
    : [["alloc","Allocations"],["decl","Declarations"],["pre","Prestarts"],["hazard","Hazards"],["faults","Fault reports"],["services","Service sheets"],["fleet","Fleet"],["hseq","HSEQ"]];
  if(state.user.role==="admin") t.push(["sched","Scheduling"],["audit","Compliance"]);
  if(state.user.sales) t.push(["sales","Sales"]);
  const cur = (state.view==="svcpick"||state.view==="form20"||state.view==="svcupload") ? "services" : (state.view==="orderDetail"||state.view==="orderpage") ? "sales" : (state.view==="declDetail"||state.view==="drivers") ? "decl" : state.view==="hazardDetail" ? "hazard" : (state.view==="preDetail"||state.view==="preNew") ? "pre" : state.view==="vehicle" ? "fleet" : state.view==="record"||state.view==="new" ? (state.newForm ? (FORMS[state.newForm].kind==="service"?"services":"faults") : (rec()&&FORMS[rec().form].kind==="service"?"services":"faults")) : state.view;
  const b = ([k,l]) => `<button class="tab" data-go="${k}" ${cur===k?'aria-current="page"':""}>${l}</button>`;
  const h = Math.ceil(t.length/2);
  return {left:t.slice(0,h).map(b).join(""), right:t.slice(h).map(b).join(""), all:t.map(b).join(""), n:t.length};
}

/* ---------- Compliance: NHVR audit pack per vehicle ----------
   Builds a zip in the browser from what the hub holds for one vehicle. */
const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){ /* files: [{name, data:Uint8Array}] -> Blob (stored, no compression) */
  const enc = new TextEncoder(), parts = [], cent = []; let off = 0;
  const d = new Date(), dt = ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)), dd = (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  files.forEach(f=>{ const nm = enc.encode(f.name), data = f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,dt,true); h.setUint16(12,dd,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,dt,true); c.setUint16(14,dd,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cent.push(new Uint8Array(c.buffer), nm); off += 30 + nm.length + data.length; });
  const csize = cent.reduce((n,x)=>n+x.length,0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...cent, new Uint8Array(e.buffer)], {type:"application/zip"});
}

function schedInfo(v){

function hzAddFiles(list){
  hzSync(); const d = hzDraft();
  Promise.all([...list].map(f=>new Promise(res=>{
    if(f.type.startsWith("image/")){ const img = new Image(), url = URL.createObjectURL(f);
      img.onload = ()=>{ const k = Math.min(1, 1600/Math.max(img.width,img.height)), c = document.createElement("canvas"); c.width = img.width*k; c.height = img.height*k;
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); const data = c.toDataURL("image/jpeg",.8); res({name:f.name, type:"image/jpeg", size:Math.round(data.length*.75), data}); };
      img.onerror = ()=>res(null); img.src = url;
    } else { const r = new FileReader(); r.onload = ()=>res({name:f.name, type:f.type||"application/octet-stream", size:f.size, data: f.size<3e6 ? r.result : ""}); r.onerror = ()=>res(null); r.readAsDataURL(f); }
  }))).then(out=>{ d.files.push(...out.filter(Boolean)); state.err = ""; render(); });
}

/* ---------- Main page background: a close-up of crushed rock under a slow moving work light ----------
   The road base texture is drawn once to an offscreen canvas; each frame only repaints it with a soft yellow
   light that drifts across. Capped at 30 frames a second,
   paused when the tab is hidden, and still for people who ask for reduced motion. */
const FIELD = {raf:0, tex:null, texW:0, texH:0, t:0, last:0};
function startField(){
  const cv = document.getElementById("bgfield"); document.body.classList.toggle("homebg", !!cv); if(!cv) return;
  const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(1.5, window.devicePixelRatio||1);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  if(!FIELD.tex || FIELD.texW!==W || FIELD.texH!==H){
    const t = document.createElement("canvas"); t.width = Math.round(W*dpr); t.height = Math.round(H*dpr); const c = t.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
    let seed = 5; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
    c.fillStyle = "#1b1a18"; c.fillRect(0,0,W,H);
    for(let n=0; n<W*H/9; n++){ const x = rnd()*W, y = rnd()*H, r = .6 + rnd()*rnd()*3.4, v = 40 + rnd()*70; c.fillStyle = `rgb(${v|0},${v*.97|0},${v*.92|0})`; c.fillRect(x, y, r, r*(.6+rnd()*.6)); }
    Object.assign(FIELD, {tex:t, texW:W, texH:H});
  }
  Object.assign(FIELD, {cv, ctx:cv.getContext("2d"), W, H, dpr});
  let still = false; try{ still = matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  if(still){ fieldDraw(); return; }
  if(!FIELD.raf) FIELD.raf = requestAnimationFrame(fieldTick);
}
window.addEventListener("resize", () => { clearTimeout(FIELD.rz); FIELD.rz = setTimeout(()=>{ if(FIELD.cv && FIELD.cv.isConnected) startField(); }, 150); });
function fieldTick(now){
  const F = FIELD; F.raf = 0;
  if(!F.cv || !F.cv.isConnected){ F.cv = null; return; }
  if(document.hidden){ setTimeout(()=>{ if(!F.raf) F.raf = requestAnimationFrame(fieldTick); }, 500); return; }
  F.raf = requestAnimationFrame(fieldTick);
  if(now - F.last < 33) return; F.last = now; F.t += 1/30; fieldDraw();
}
function fieldDraw(){
  const F = FIELD, c = F.ctx, W = F.W, H = F.H;
  c.setTransform(1,0,0,1,0,0); c.drawImage(F.tex, 0, 0); c.setTransform(F.dpr,0,0,F.dpr,0,0);
  // a broad work light drifts slowly across on its own
  const x = W*(.2 + .6*(Math.sin(F.t*.2)+1)/2), y = H*(.3 + .15*Math.sin(F.t*.13));
  const g = c.createRadialGradient(x, y, 10, x, y, H*.7); g.addColorStop(0,"rgba(245,180,0,.10)"); g.addColorStop(1,"rgba(0,0,0,.55)");
  c.fillStyle = g; c.fillRect(0,0,W,H);
}

function jobWarnings(j){
  const w = [], v = state.fleet.find(x=>x.rego===j.truck);
  if(!j.driver) w.push("No driver yet"); if(!j.truck) w.push("No truck yet");
  if(j.driver && j.date===todayISO() && j.status==="Allocated" && !state.decls.some(d=>d.driver===j.driver && d.date===j.date)) w.push(`${j.driver} hasn't done today's declaration`);

function readSection(formEl, fields, data){
  fields.forEach(f=>{
    if(f.type==="faults"){
      data.faults = [...formEl.querySelectorAll("[data-fd]")].map((el,i)=>({desc:el.value.trim(), sev:(formEl.querySelector(`input[name=sev${i}]:checked`)||{}).value||"", loc:formEl.querySelector(`[data-fl="${i}"]`).value.trim()}));
    } else if(f.type==="ranking"){
      const n = ((data.faults||[]).filter(x=>x.desc)).length;
      data[f.id] = Array.from({length:n},(_,i)=>{ const c = formEl.querySelector(`input[name=rk${i}]:checked`), d = formEl.querySelector(`input[name=rkd${i}]`); return {sev:c?c.value:"", done:!!(d&&d.checked)}; });
    } else if(f.type==="checklist"){
      data.checks = {}; f.items.forEach((it,i)=>{ const c = formEl.querySelector(`input[name=chk${i}]:checked`); if(c) data.checks[it]=c.value; });
    } else if(f.type==="reasons"){
      data[f.id] = f.options.filter((o,i)=>{ const c = formEl.querySelector(`input[name="${f.id}_${i}"]`); return c && c.checked; });
    } else if(f.type==="agree"){
      const c = formEl.querySelector(`input[name="${f.id}"]`); data[f.id] = c && c.checked ? "Yes" : "";
    } else if(f.type==="rows"){
      const rows = []; formEl.querySelectorAll(`[data-rows="${f.id}"]`).forEach(el=>{ (rows[+el.dataset.r] ||= [])[+el.dataset.c] = el.value.trim(); });
      data[f.id] = rows.filter(r=>r && r.some(Boolean));
    } else if(f.type==="svcitems"){
      const out = {}; SVC[f.svc].sections.forEach((sec,si)=>sec.items.forEach((it,ii)=>{ const k = si+"-"+ii, c = formEl.querySelector(`input[name="sv_${k}"]:checked`), n = formEl.querySelector(`[data-svn="${k}"]`);
        if(c || (n && n.value.trim())) out[k] = {s:c?c.value:"", n:n?n.value.trim():""}; }));
      data[f.id] = out;
    } else if(f.type==="choice"){
      const c = formEl.querySelector(`input[name="${f.id}"]:checked`); data[f.id] = c ? c.value : "";
    } else {
      const el = formEl.querySelector(`[name="${f.id}"]`); if(el && !el.disabled) data[f.id] = el.value.trim();
    }
  });
  if(data.rego) data.rego = data.rego.toUpperCase();
}
function missing(fields, data){
  const out = [];
  fields.forEach(f=>{ if(f.requiredIf && data[f.requiredIf[0]]===f.requiredIf[1] && !data[f.id]) out.push(f.short||f.label.toLowerCase());
    if(!f.required) return;
    if(f.type==="faults"){ const ok = (data.faults||[]).filter(x=>x.desc); if(!ok.length) out.push("at least one fault"); else if(ok.some(x=>!x.sev)) out.push("a severity for each fault"); }
    else if(f.type==="svcitems"){ const total = SVC[f.svc].sections.reduce((n,x)=>n+x.items.length,0), done = Object.values(data[f.id]||{}).filter(x=>x.s).length; if(done<total) out.push(`${total-done} checklist item${total-done>1?"s":""} not marked`); }
    else if(!data[f.id]) out.push(f.short || f.label.toLowerCase()); });
  return out;
}

    if(miss.length){ state.err = "Still needed: "+miss.join(", ")+"."; render(); return; }
    const id = "u"+Date.now(), files = [];
    try{ for(const [i,f] of d.files.entries()){ const fid = id+"-"+i; await IDB.put(fid, f.blob); files.push({fid, name:f.name, type:f.type, size:f.size}); } }
    catch(err){ state.err = "Couldn't save the file on this device. Try a smaller PDF or fewer photos."; render(); return; }
    const odo = d.odo.replace(/[^\d]/g,""), u = {id, rego:v.rego, svc:d.svc, kind:v.type==="Trailer"?"trailer":v.type==="Light vehicle"?"light vehicle":"truck", date:d.date, odo, by:d.by, invoice:d.invoice, notes:d.notes, files, upBy:state.user.name, at:new Date().toISOString()};
    state.uploads = [u, ...(state.uploads||[])]; saveKey("uploads", state.uploads);
    if(odo && !(+v.odometer >= +odo)) setKm(v, odo, d.date, "Uploaded service sheet");
    state.upDraft = null; state.err = ""; go("services"); toast(`${d.svc.toUpperCase()} service sheet filed for ${v.rego}`); return;
  }
  if(e.target.id==="schedForm"){
    const v = state.fleet.find(x=>x.rego===e.target.dataset.rego), fd = new FormData(e.target), g = k => (fd.get(k)||"").toString().trim();
    if(fd.has("odometer")){ const o = g("odometer").replace(/[,\s]/g,""); if(o && o!==String(v.odometer||"")) setKm(v, o, todayISO()); }
    if(fd.has("nextServiceKm")) v.nextServiceKm = g("nextServiceKm").replace(/[,\s]/g,"");
    v.nextServiceDate = g("nextServiceDate"); v.inspectionDue = g("inspectionDue"); saveFleet();
    state.sched = state.sched || {}; if(g("bdate")) state.sched[v.rego] = {date:g("bdate"), type:g("btype"), with:g("bwith"), notes:g("bnotes"), by:state.user.name, at:new Date().toISOString()}; else delete state.sched[v.rego];
    saveKey("sched", state.sched); state.schedEdit = ""; render(); toast(`${v.rego} updated`); return;
  }
  if(e.target.id==="quickVeh"){
    const v = state.fleet.find(x=>x.rego===state.veh), fd = new FormData(e.target);
    VEHICLE_FIELDS.filter(f=>f.quick).forEach(f=>{ v[f.id] = (fd.get(f.id)||"").trim(); }); inspWithRego(v); saveFleet(); toast(`${v.rego} saved`); return;
  }
  if(e.target.id==="vehForm"){
    const isNew = state.veh==="__new", fd = new FormData(e.target);
    let v;
    if(isNew){
      const rego = (fd.get("rego")||"").trim().toUpperCase().replace(/\s+/g,"");
      if(!rego){ state.err = "Enter the registration number."; render(); return; }
      if(state.fleet.some(x=>x.rego===rego)){ state.err = rego+" is already in the fleet."; render(); return; }
      v = {rego}; state.fleet.push(v);
    } else v = state.fleet.find(x=>x.rego===state.veh);
    const oldKm = String(v.odometer||"");
    VEHICLE_FIELDS.forEach(f=>{ if(fd.has(f.id)) v[f.id] = (fd.get(f.id)||"").trim(); });
    v.vin = v.vin.toUpperCase(); v.odometer = v.odometer.replace(/[,\s]|km/gi,"");
    if(v.odometer && v.odometer!==oldKm) setKm(v, v.odometer, v.odoDate||todayISO());
    state.err = ""; saveFleet(); go("vehicle",{veh:v.rego}); toast(isNew?`${v.rego} added to the fleet`:`${v.rego} saved`);
  }
  if(e.target.id==="mechForm"){
    const r = rec(), def = FORMS[r.form];
    const who = e.target.dataset.mode==="admin" ? "admin" : "mechanic";
    def.sections.filter(s=>s.who===who).forEach(s=>readSection(e.target, s.fields, r.data));
    save(state.records); toast(`Saved. Report is now ${status(r).toLowerCase()}`);
  }
});
function syncDraft(){ const f = document.getElementById("sheet"); if(!f) return; const def = FORMS[state.newForm]; def.sections.forEach(s=>readSection(f, s.fields, state.draft)); }
app.addEventListener("click", e=>{

    src.forEach((j,i)=>{ const c = Object.assign(JSON.parse(JSON.stringify(j)), {id:"j"+Date.now()+i, date:nx, status:"Allocated"}); delete c.example; state.jobs.push(c); });
    saveJobs(); state.allocDay = nx; toast(`${src.length} job${src.length>1?"s":""} copied to ${fmtDate(nx)}`); return; }
  if(t.dataset.drph){ const n = state.drivers[+t.dataset.drph], nv = prompt(`${n}'s mobile number, for sending jobs on WhatsApp`, state.drvPhones[n]||""); if(nv==null) return;
    const d = nv.replace(/[^\d+]/g,""); if(d && d.replace(/\D/g,"").length<9){ toast("That doesn't look like a mobile number"); return; }
    if(d) state.drvPhones[n] = nv.trim(); else delete state.drvPhones[n]; savePins(); render(); toast(d?`Saved ${n}'s mobile`:`Removed ${n}'s mobile`); return; }
  if(t.dataset.drid){ const n = state.drivers[+t.dataset.drid], cur = state.drvIds[n]||"", nv = prompt(`Driver number for ${n}. Suggested: ${newDrvId(n)}`, cur); if(nv==null) return;
    const id = nv.trim().toUpperCase().replace(/\s+/g,""); if(!/^D[A-Z0-9-]{2,}$/.test(id)){ toast("Driver numbers start with D, like DABC123"); return; }
    const other = state.drivers.find(x=>x!==n && normId(state.drvIds[x])===normId(id)); if(other){ toast(`${id} is already ${other}'s number`); return; }
    state.drvIds[n] = id; savePins(); render(); toast(`${n} is now ${id}`); return; }
  if(t.dataset.drpin){ const n = state.drivers[+t.dataset.drpin]; if(!confirm(`Give ${n} a new PIN? Their old PIN stops working.`)) return; state.pins[n] = newPin(4); savePins(); toast(`${n}'s new PIN is ${state.pins[n]}`); return; }
  if(t.id==="newSite"){ if(!confirm("Make a new site code? The old one stops working.")) return; state.siteCode = newPin(6); savePins(); toast(`New site code ${state.siteCode}`); return; }
  if(t.dataset.drleft){ const n = state.drivers[+t.dataset.drleft]; if(!confirm(`Remove ${n} from the driver list? Their past declarations and prestarts are kept.`)) return;
    state.drivers = state.drivers.filter(x=>x!==n); state.former = [...new Set([...state.former, n])].sort(); saveDrivers(); toast(`${n} moved to former drivers`); return; }
  if(t.dataset.drback){ const n = state.former[+t.dataset.drback]; state.former = state.former.filter(x=>x!==n); state.drivers = [...new Set([...state.drivers, n])].sort(); saveDrivers(); toast(`${n} is back on the driver list`); return; }
  if(t.id==="renewRego"){ const v = state.fleet.find(x=>x.rego===state.veh), base = v.regoExpiry || todayISO(); v.regoExpiry = addMonths(base, renewMonths(v)); inspWithRego(v); saveFleet(); toast(`${v.rego} rego now due ${fmtDate(v.regoExpiry)}`); return; }
  if(t.dataset.hz){ go("hazardDetail",{hzId:t.dataset.hz, viewFile:null}); return; }
  if(t.dataset.viewfile){ state.viewFile = +t.dataset.viewfile; render(); return; }
  if(t.id==="closeView"){ state.viewFile = null; render(); return; }
  if(t.dataset.rmfile){ hzSync(); hzDraft().files.splice(+t.dataset.rmfile,1); render(); return; }
  if(t.id==="hzClose"){ const h = state.hazards.find(x=>x.id===state.hzId); h.closed = !h.closed; saveKey("hazard", state.hazards); toast(h.closed?"Report closed":"Report reopened"); return; }
  if(t.id==="printSheet"){ window.print(); return; }
  if(t.id==="menuBtn"){ state.menu = !state.menu; render(); return; }
  if(t.id==="logout"){ setUser(null); state.user=null; state.pub=null; state.menu=false; render(); return; }
  if(t.dataset.pre){ go("preDetail",{preId:t.dataset.pre}); return; }
  if(t.dataset.pfilter){ state.preFilter = t.dataset.pfilter; render(); return; }

    const items = p.items ? Object.entries(p.items).filter(([k,x])=>x==="FAULT").map(([k])=>k) : [];
    const faults = items.length ? items.map((k,i)=>({desc: k + (p.details && i===0 ? ": "+p.details : ""), sev, loc:""})) : [{desc:p.details||"", sev, loc:""}];
    go("new",{newForm:"hv-fault"});
    state.draft = {date:p.date||todayISO(), supplier:SUPPLIERS.length===1?SUPPLIERS[0]:"", rego:p.rego, makeModel:v?v.makeModel:"", odometer:p.odometer||"", faults};
    render(); return;
  }
  if(t.dataset.decl){ go("declDetail",{declId:t.dataset.decl}); return; }
  if(t.dataset.dfilter){ state.declFilter = t.dataset.dfilter; render(); return; }
  if(t.id==="declAgain"){ state.declAgain = true; state.declDraft = null; render(); return; }
  if(t.id==="addVeh"){ state.err=""; go("vehicle",{veh:"__new"}); return; }
  if(t.dataset.upopen){ const u = (state.uploads||[]).find(x=>x.id===t.dataset.upopen); if(u) upOpen(u, 0); return; }
  if(t.dataset.uprm){ upSync(); state.upDraft.files.splice(+t.dataset.uprm,1); render(); return; }
